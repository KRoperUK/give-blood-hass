name: HACS

# Standalone HACS repository validation. Duplicated from ci.yml on purpose: this
# runs regardless of the paths filter, because a repository-level problem (missing
# release asset, bad hacs.json) blocks installation even when no code changed.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: HACS tightens its requirements over time, and a scheduled run
    # surfaces that before a release does.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@main
        with:
          category: integration
