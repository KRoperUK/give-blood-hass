name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "zensical.toml"
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "CHANGELOG.md"
      - "custom_components/nhs_give_blood/manifest.json"
      - "custom_components/nhs_give_blood/const.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages deployments must not overlap, and cancelling a half-finished one can
# leave the site in a broken state — so queue rather than cancel.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Zensical
        run: |
          python -m pip install --upgrade pip
          pip install zensical

      - name: Build documentation
        run: zensical build

      # docs/CNAME is copied into the build output, which is what keeps the
      # custom domain bound to give-blood-hass.kroper.uk across deployments.
      - name: Verify the custom domain survived the build
        run: |
          test -f site/CNAME || { echo "::error::site/CNAME missing — the custom domain would be dropped"; exit 1; }
          grep -qx 'give-blood-hass.kroper.uk' site/CNAME || {
            echo "::error::site/CNAME does not contain give-blood-hass.kroper.uk"; exit 1; }
          echo "custom domain: $(cat site/CNAME)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
