name: Feature request
description: Suggest something this integration should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Requests to add booking, rescheduling or cancelling are read, but start from
        a position of "no" — see
        [why it is read-only](https://give-blood-hass.kroper.uk/design/#why-read-only).
        If you want to make the case, please address the risk argument there directly.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do that you cannot do today
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to see
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you have tried instead
      description: Template sensors, automations, the library CLI.
