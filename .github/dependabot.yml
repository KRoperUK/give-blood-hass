version: 2
updates:
  # Grouped so a batch of routine bumps is one review, not eight. Ungrouped
  # Dependabot on a repo with pinned action SHAs produces a PR per action per
  # release, which trains you to merge without reading.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      # Every action here is pinned to a SHA, so a bump is unreviewable without
      # reading the release notes anyway. One PR keeps that a single task.
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - python
    groups:
      # Runtime dependencies are what reaches users, so they get their own PR
      # and their own review.
      runtime:
        dependency-type: production
        patterns:
          - "*"
      # Lint and test tooling. Grouped because a ruff or mypy bump usually needs
      # the same "run it and fix the fallout" pass regardless of which one moved.
      dev-tooling:
        dependency-type: development
        patterns:
          - "*"
    ignore:
      # The Home Assistant floor is set deliberately to "latest release minus
      # about one month" so the integration keeps working for people who have not
      # updated yet. Tracking upstream would silently narrow that, so the floor
      # moves by hand when the support window does — not by a bot.
      #
      # Patch bumps are ignored too, not just major and minor. Raising the floor
      # from 2026.8.0 to 2026.8.3 would exclude anyone still on 2026.8.0 for no
      # reason: the integration does not need anything added in those patches. A
      # floor is a compatibility claim, not a record of the newest release.
      - dependency-name: homeassistant
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
